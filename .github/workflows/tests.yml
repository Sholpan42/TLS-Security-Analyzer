name: Tests and TLS security gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and integration tests
        env:
          RUN_NETWORK_TESTS: "1"
        run: python -m unittest discover -s tests -t . -v

  tls-security-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan target and enforce the security gate
        run: python TLS_Analyzer.py example.com --fail-on critical --json > tls-scan.json
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: tls-scan-report
          path: tls-scan.json
